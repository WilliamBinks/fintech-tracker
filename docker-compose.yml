services:
  db:
    image: postgres:16
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fintech
    volumes: 
      - dbdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fintech
    depends_on:
      - db
    ports:
      - "3000:3000"

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  dbdata: