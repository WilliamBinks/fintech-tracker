services:
  server:
    command: npx nodemon server.js
    volumes:
      - ./server:/app         
      - /app/node_modules      

  client:
    build:
      context: ./client
      target: build           
    command: npm run dev -- --host 0.0.0.0   
    environment:
      VITE_API_PROXY: http://server:3000     
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"            
